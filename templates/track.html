<!DOCTYPE html>
<html>
<head>
    <title>Track Token</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">🔍 Track Your Appointment</h2>

    <form method="POST" class="card p-4 shadow">

        <div class="mb-3">
            <label>Department</label>
            <select name="department" class="form-control" required>
                <option value="">Choose Department</option>
                <option value="General">General</option>
                <option value="Dental">Dental</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Cardiology">Cardiology</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Token Number</label>
            <input type="number" name="token" class="form-control" required>
        </div>

        <button class="btn btn-primary w-100">Track</button>
    </form>

    {% if result %}
    <div class="card mt-4 p-4 shadow">
        <h4>Tracking Result</h4>
        <p><strong>Current Serving:</strong> {{ result.current }}</p>
        <p><strong>Your Position:</strong> {{ result.position }}</p>
        <p><strong>Estimated Waiting Time:</strong> {{ result.estimated }} minutes</p>
    </div>
    {% endif %}

</div>

</body>
</html>
