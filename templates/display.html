<!DOCTYPE html>
<html>
<head>
    <title>Waiting Room Display</title>

    <!-- REMOVE AUTO REFRESH -->
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        /* Flash Effect */

        .flash {
        animation: flashEffect 0.6s ease-in-out 4;
        }

        @keyframes flashEffect {
            0%   { transform: scale(1); box-shadow: 0 0 0px red; }
            50%  { transform: scale(1.08); box-shadow: 0 0 50px 20px red; }
            100% { transform: scale(1); box-shadow: 0 0 0px red; }
        }

        /* Slide Animation */
        .slide-animation {
            animation: slideEffect 0.6s ease-in-out;
        }

        @keyframes slideEffect {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body style="background-color: #f8f9fa; color: #000;">

<div class="container-fluid text-center mt-5">

    <h1 class="mb-4 text-primary fw-bold">
    🏥 {{ department.upper() }} DEPARTMENT QUEUE
    </h1>

    <!-- Current Token -->
    <div id="currentTokenCard" class="card shadow-lg mb-5 border border-3 border-primary" style="background-color: white;">
        <div class="card-body">
            <h2>Now Serving</h2>
            <h1 id="currentTokenNumber" class="display-1 fw-bold">
                {{ current_token }}
            </h1>
        </div>
    </div>

    <!-- Upcoming Tokens -->
    <div class="card bg-light text-dark shadow-lg">
        <div class="card-body">
            <h3 class="mb-4">Upcoming Tokens</h3>

            <div class="row justify-content-center">

                {% if next_patients %}
                    {% for p in next_patients %}
                    <div class="col-md-2">
                        <div class="card mb-3 
                            {% if p.priority == 'Emergency' %}
                                bg-danger text-white
                            {% else %}
                                bg-secondary text-white
                            {% endif %}">
                            <div class="card-body">
                                <h2>{{ p.token }}</h2>
                                {% if p.priority == 'Emergency' %}
                                    <small>Emergency</small>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <p>No upcoming patients</p>
                {% endif %}

            </div>

        </div>
    </div>

</div>

<!-- Bell Sound -->
<audio id="bellSound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script>
let lastToken = "{{ current_token }}";

// 🎤 Voice Announcement with Department
function speakToken(token) {
    const department = "{{ department }}";

    const message = new SpeechSynthesisUtterance(
        department + " department, token number " + token + ", please proceed to consultation room."
    );

    message.rate = 0.9;
    message.pitch = 1;
    message.volume = 1;

    speechSynthesis.speak(message);
}

// 🔄 Live Token Change Detection
async function checkTokenChange() {
    const response = await fetch(window.location.pathname);
    const text = await response.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");

    const newToken = doc.getElementById("currentTokenNumber").innerText;

    if (newToken !== lastToken) {

    lastToken = newToken;

    // Only trigger alert if token > 0
    if (parseInt(newToken) > 0) {

        // 🔔 Bell
        const bell = document.getElementById("bellSound");
        bell.currentTime = 0;
        bell.play().catch(e => console.log("Bell blocked:", e));

        // 🎤 Voice
        speakToken(newToken);

        // 🔴 Flash
        const card = document.getElementById("currentTokenCard");
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");

        // 🎬 Slide
        const tokenElement = document.getElementById("currentTokenNumber");
        tokenElement.classList.remove("slide-animation");
        void tokenElement.offsetWidth;
        tokenElement.classList.add("slide-animation");

        tokenElement.innerText = newToken;
    } else {
        document.getElementById("currentTokenNumber").innerText = newToken;
    }
}
}

// Check every 3 seconds
setInterval(checkTokenChange, 3000);
</script>

</body>
</html>
